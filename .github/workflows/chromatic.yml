name: Chromatic

# DESATIVADO TEMPORARIAMENTE em 2026-07-10: incidente no Capture Cloud do
# Chromatic (status.chromatic.com) deixou os builds presos em "Running N
# tests" indefinidamente, travando a fila de Actions do repo (26 runs presos
# em in_progress/queued simultaneamente, em branches não relacionadas).
# Trigger trocado de `push` para manual (`workflow_dispatch`) até o serviço
# normalizar. Ver AGENTS.md > "Dívidas técnicas conhecidas" para o registro
# e o passo a passo de reversão.
#
# Configuração original (reativar quando o Chromatic normalizar):
# on:
#   push:
#     branches:
#       - 'feature/**'
#       - develop
on:
  workflow_dispatch:

jobs:
  chromatic:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TurboSnap e a comparação com a baseline precisam do histórico completo.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # build-storybook já roda `pnpm sb:css` antes do `storybook build`
          # (Tailwind v4 pré-compilado). A flag --webpack-stats-json do TurboSnap
          # é anexada ao final, chegando ao `storybook build`.
          buildScriptName: build-storybook
          # TurboSnap: só snapshota o que mudou desde a baseline.
          onlyChanged: true
          # Mudança visual não derruba o job — a aprovação acontece no check do
          # Chromatic no PR.
          exitZeroOnChanges: true
          # Pushes em develop consolidam a baseline visual automaticamente.
          autoAcceptChanges: develop
